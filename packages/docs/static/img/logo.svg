<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#161e33" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Clean Circle Background -->
  <circle cx="50" cy="50" r="45" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Coordinate Axis (Subtle background reference) -->
  <line x1="62.5" y1="15" x2="62.5" y2="85" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Smooth Sine Wave -->
  <path d="M 22 50 C 32 20, 48 20, 50 50 C 52 80, 68 80, 78 50" fill="none" stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Goal-Oriented Target (Centered on the wave coordinate) -->
  <circle cx="62.5" cy="72.5" r="9" fill="none" stroke="#f59e0b" stroke-width="2" />
  <circle cx="62.5" cy="72.5" r="3" fill="#f59e0b" />
</svg>
