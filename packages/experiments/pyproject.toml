[project]
name = "hp-dfr"
version = "0.1.0"
description = "PINNs and Deep Fourier Residual methods for solving PDEs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Carlos Vera-Ciro", email = "caverac@gmail.com" },
]
keywords = ["pinns", "physics-informed-neural-networks", "pde", "deep-learning", "fourier"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0.2",
    "click>=8.1.8",
    "rich>=13.9.4",
    "scipy>=1.10.0,<1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.optional-dependencies]
tensorflow = [
    "tensorflow>=2.18.0",
    "keras>=3.7.0",
]
jax = [
    "jax>=0.4.38",
    "jaxlib>=0.4.38",
    "optax>=0.2.4",
]
pytorch = [
    "torch>=2.0.0,<2.2.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "torch>=2.5.1; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]
all = [
    "hp-dfr[tensorflow,jax,pytorch]",
]

[project.scripts]
hp-dfr = "hp_dfr.cli:main"

[project.urls]
Homepage = "https://github.com/caverac/hp-dfr"
Documentation = "https://caverac.github.io/hp-dfr/"
Repository = "https://github.com/caverac/hp-dfr"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hp_dfr"]
