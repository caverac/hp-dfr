[project]
name = "hp-dfr"
version = "0.1.0"
description = "PINNs and Deep Fourier Residual methods for solving PDEs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Carlos Vera-Ciro", email = "caverac@gmail.com"},
]
keywords = ["pinns", "physics-informed-neural-networks", "pde", "deep-learning", "fourier"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0.2",
    "click>=8.1.8",
    "rich>=13.9.4",
    "scipy>=1.10.0,<1.15.0",
]

[project.optional-dependencies]
tensorflow = [
    "tensorflow>=2.18.0",
    "keras>=3.7.0",
]
jax = [
    "jax>=0.4.38",
    "jaxlib>=0.4.38",
    "optax>=0.2.4",
]
pytorch = [
    "torch>=2.0.0,<2.2.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "torch>=2.5.1; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]
all = [
    "hp-dfr[tensorflow,jax,pytorch]",
]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "flake8>=7.1.0",
    "pylint>=3.3.0",
    "pydocstyle>=6.3.0",
]

[project.scripts]
hp-dfr = "hp_dfr.cli:main"

[project.urls]
Homepage = "https://github.com/caverac/hp-dfr"
Documentation = "https://caverac.github.io/hp-dfr/"
Repository = "https://github.com/caverac/hp-dfr"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hp_dfr"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["hp_dfr"]
skip_gitignore = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.main]
py-version = "3.11"
jobs = 0
load-plugins = [
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
]
ignore-paths = [
    "tests",
    "data",
]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring (handled by pydocstyle)
    "C0116",  # missing-function-docstring (handled by pydocstyle)
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0511",  # fixme (allow TODO comments)
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-locals = 20

[tool.pydocstyle]
convention = "numpy"
add-ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
]
match = '(?!test_).*\.py'
match-dir = '(?!tests).*'
