# Pre-commit hooks mirror the CI gates. Install with:
#   uv run pre-commit install
# (the commit-msg hook is installed automatically via default_install_hook_types).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      # --- Python formatters (auto-fix) ---
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        files: ^packages/experiments/

      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
        files: ^packages/experiments/

      # --- Python linters ---
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
        files: ^packages/experiments/

      # pylint and pydocstyle run on src only, matching the CI gate (tests trip
      # matplotlib/pytest false positives not worth disabling).
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        files: ^packages/experiments/src/

      - id: pydocstyle
        name: pydocstyle
        entry: uv run pydocstyle
        language: system
        types: [python]
        files: ^packages/experiments/src/

      # --- Python typecheck (whole-package, not per-file) ---
      - id: mypy
        name: mypy
        entry: uv run mypy packages/experiments/src/hp_dfr
        language: system
        types: [python]
        pass_filenames: false
        files: ^packages/experiments/

      # --- JS/TS formatter (auto-fix; respects .prettierignore) ---
      - id: prettier
        name: prettier
        entry: yarn prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, markdown, yaml, css]

      # --- JS/TS linter (auto-fix where possible) ---
      - id: eslint
        name: eslint
        entry: yarn eslint --max-warnings 0 --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]

  # --- Commit message lint (Conventional Commits, for semantic-release) ---
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: yarn commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
