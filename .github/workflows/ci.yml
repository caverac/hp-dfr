name: CI

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Python (experiments) -- quality checks (run in parallel)
  # ===========================================================================

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting (black)
        run: uv run black --check packages/experiments/src packages/experiments/tests

      - name: Check import order (isort)
        run: uv run isort --check-only packages/experiments/src packages/experiments/tests

      - name: Lint (flake8)
        run: uv run flake8 packages/experiments/src packages/experiments/tests

      - name: Lint (pylint)
        run: uv run pylint packages/experiments/src

      - name: Docstrings (pydocstyle)
        run: uv run pydocstyle packages/experiments/src

  typecheck-python:
    name: Typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run mypy
        run: uv run mypy packages/experiments/src

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest packages/experiments/tests

  # ===========================================================================
  # TypeScript (docs) -- quality checks (run in parallel)
  # ===========================================================================

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: ESLint
        run: yarn lint

      - name: Prettier
        run: yarn format

  build-docs:
    name: Build (Docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build docs site
        run: yarn docs:build

  # ===========================================================================
  # Preprint (LaTeX) -- regenerate the figure and compile the manuscript
  # ===========================================================================

  build-preprint:
    name: Build (Preprint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Regenerate figures from saved data
        run: uv run hp-dfr figures

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-publishers texlive-science texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Compile manuscript
        working-directory: packages/preprint
        run: make
