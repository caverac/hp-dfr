[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hp-dfr-workspace"
version = "0.1.0"
description = "Adaptive hp-DFR: Goal-Oriented Deep Fourier Residual Methods"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "Carlos Vera-Ciro", email = "caverac@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "hp-dfr",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "pylint>=3.3.0",
    "flake8>=7.1.0",
    "flake8-bugbear>=24.0.0",
    "flake8-comprehensions>=3.15.0",
    "pydocstyle>=6.3.0",
    "isort>=5.13.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.uv]

[tool.uv.workspace]
members = ["packages/experiments"]

[tool.uv.sources]
hp-dfr = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["packages/*"]

[tool.black]
target-version = ["py311", "py312", "py313"]
line-length = 140
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | build
    | dist
    | node_modules
    | cdk\.out
    | packages/docs
    | packages/infra
)/
'''

[tool.isort]
profile = "black"
line_length = 140
known_first_party = ["hp_dfr"]
skip_gitignore = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["node_modules", "cdk.out", "packages/docs", "packages/infra"]

[tool.pylint.main]
py-version = "3.11"
jobs = 0
ignore = ["node_modules", "cdk.out"]
ignore-paths = [".*/__pycache__/.*", "packages/docs/.*", "packages/infra/.*"]
load-plugins = [
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
]

[tool.pylint.format]
max-line-length = 140

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring (handled by pydocstyle)
    "C0116",  # missing-function-docstring (handled by pydocstyle)
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0511",  # fixme (allow TODO comments)
    "duplicate-code",
]

[tool.pylint.design]
max-args = 10
max-locals = 20

[tool.pydocstyle]
convention = "numpy"
add-ignore = ["D100", "D104", "D105", "D107"]
match = '(?!test_).*\.py'
match-dir = '(?!tests|node_modules|cdk\.out|packages/docs|packages/infra).*'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
exclude = [
    "__pycache__",
    "\\.pyc$",
    "packages/docs/",
    "packages/infra/",
    "node_modules/",
    "cdk\\.out/",
    "conftest\\.py$",
]

[tool.pytest.ini_options]
testpaths = ["packages/experiments/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --import-mode=importlib --cov=packages/experiments/src/hp_dfr --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/cli.py",
    "packages/docs/*",
    "packages/infra/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise ValueError",
]
